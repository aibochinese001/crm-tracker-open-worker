<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户管理系统</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  ${themeResources}  <style>
    .login-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .login-box {
      backdrop-filter: blur(8px);
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .input-field {
      transition: all 0.3s;
      border: 1px solid #e2e8f0;
    }
    .input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
    }
    html.dark .login-container {
      background: linear-gradient(135deg, #3b4cc4 0%, #4a2b6b 100%);
    }
    html.dark .login-box {
      background-color: rgba(17, 24, 39, 0.95);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    html.dark .login-box .text-gray-800 { color: #f3f4f6; }
    html.dark .login-box .text-gray-600,
    html.dark .login-box .text-gray-700 { color: #cbd5e1; }
    .tab-btn { transition: all 0.2s; }
    .tab-btn.active { background: #667eea; color: #fff; }
    html.dark .tab-btn.active { background: #4f6ad1; }
  </style>
</head>
<body class="login-container flex items-center justify-center">
  <div class="login-box p-8 rounded-xl w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-calendar-check mr-2"></i>客户管理系统</h1>
      <p class="text-gray-600 mt-2">登录管理您的客户</p>
    </div>

    <div class="flex mb-6 bg-gray-200 rounded-lg p-1" id="tabBar">
      <button type="button" id="tabLogin" class="tab-btn active flex-1 py-2 rounded-md text-sm font-medium">
        <i class="fas fa-sign-in-alt mr-1"></i>登录
      </button>
      <button type="button" id="tabRegister" class="tab-btn flex-1 py-2 rounded-md text-sm font-medium text-gray-600">
        <i class="fas fa-user-plus mr-1"></i>注册
      </button>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-user mr-2"></i>用户名
        </label>
        <input type="text" id="username" name="username" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-lock mr-2"></i>密码
        </label>
        <input type="password" id="password" name="password" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>

      <button type="submit"
        class="btn-primary w-full py-3 rounded-lg text-white font-medium focus:outline-none">
        <i class="fas fa-sign-in-alt mr-2"></i>登录
      </button>

      <div id="errorMsg" class="text-red-500 text-center" role="alert"></div>
    </form>

    <form id="registerForm" class="space-y-6" style="display:none">
      <div>
        <label for="regUsername" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-user mr-2"></i>用户名
        </label>
        <input type="text" id="regUsername" name="username" required
          placeholder="3-32 位字母、数字或下划线"
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>

      <div>
        <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-lock mr-2"></i>密码
        </label>
        <input type="password" id="regPassword" name="password" required
          placeholder="至少 8 位"
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>

      <div>
        <label for="regPassword2" class="block text-sm font-medium text-gray-700 mb-1">
          <i class="fas fa-lock mr-2"></i>确认密码
        </label>
        <input type="password" id="regPassword2" name="password2" required
          class="input-field w-full px-4 py-3 rounded-lg text-gray-700 focus:outline-none">
      </div>

      <button type="submit"
        class="btn-primary w-full py-3 rounded-lg text-white font-medium focus:outline-none">
        <i class="fas fa-user-plus mr-2"></i>注册
      </button>

      <div id="regErrorMsg" class="text-red-500 text-center" role="alert"></div>
    </form>
  </div>

  <script>
    // tab 切换
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    function switchTab(active) {
      if (active === 'login') {
        loginForm.style.display = '';
        registerForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabLogin.classList.remove('text-gray-600');
        tabRegister.classList.remove('active');
        tabRegister.classList.add('text-gray-600');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = '';
        tabRegister.classList.add('active');
        tabRegister.classList.remove('text-gray-600');
        tabLogin.classList.remove('active');
        tabLogin.classList.add('text-gray-600');
      }
    }
    tabLogin.addEventListener('click', () => switchTab('login'));
    tabRegister.addEventListener('click', () => switchTab('register'));

    // 登录
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const button = e.target.querySelector('button');
      const originalContent = button.innerHTML;
      button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
      button.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          // 若 URL 带 next（站内路径）登录后回跳（支付结果页等场景）
          const next = new URLSearchParams(location.search).get('next');
          window.location.href = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/admin';
        } else {
          document.getElementById('errorMsg').textContent = result.message || '用户名或密码错误';
          button.innerHTML = originalContent;
          button.disabled = false;
        }
      } catch (error) {
        document.getElementById('errorMsg').textContent = '发生错误，请稍后再试';
        button.innerHTML = originalContent;
        button.disabled = false;
      }
    });

    // 注册
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const password2 = document.getElementById('regPassword2').value;
      const msgEl = document.getElementById('regErrorMsg');

      if (password !== password2) {
        msgEl.textContent = '两次输入的密码不一致';
        return;
      }

      const button = e.target.querySelector('button');
      const originalContent = button.innerHTML;
      button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>注册中...';
      button.disabled = true;

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (result.success) {
          window.location.href = '/admin';
        } else {
          msgEl.textContent = result.message || '注册失败，请稍后再试';
          button.innerHTML = originalContent;
          button.disabled = false;
        }
      } catch (error) {
        msgEl.textContent = '发生错误，请稍后再试';
        button.innerHTML = originalContent;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
