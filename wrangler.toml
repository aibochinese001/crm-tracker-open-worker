name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 首次部署默认走 workers.dev 域名
# 若要绑定自定义域名，取消下面注释并替换成你自己的域名：
# routes = [{ pattern = "your-domain.com", custom_domain = true }]
workers_dev = true

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# KV 命名空间配置（运行 npm run setup 自动创建并回填真实 ID，无需手动修改）

# 静态资源：托管 public/ 目录下的 JS/CSS/HTML 给浏览器
# 使用方式：浏览器访问 /js/lib/api-client.js 等同于 public/js/lib/api-client.js
# 不命中静态资源的请求由 Worker fetch handler 处理（默认行为）
[assets]
directory = "./public"
binding = "ASSETS"

# 定时任务配置 - 每小时检查一次（UTC）
# KV 命名空间配置（自动生成）
[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

# D1 数据库（SaaS 多用户版主存储）
[[d1_databases]]
binding = "DB"
database_name = "crm-saas-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 * * * *"]

# 环境变量（可选，也可以在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"
